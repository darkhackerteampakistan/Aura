<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURA — Wellness Verification</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{--bg:#f4f7f1;--paper:#fbfdf9;--green:#3a6b4c;--green-dark:#254732;--green-soft:#e2ede2;--cream:#f8f4ea;--ink:#1e2a20;--muted:#6b7a6c;--line:#dde6d8;--gold:#b89552;}
  html,body{height:100%;}
  body{font-family:'Karla',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;position:relative;overflow-x:hidden;}
  body::before{content:"";position:fixed;top:-200px;right:-200px;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(58,107,76,0.06),transparent 70%);pointer-events:none;z-index:0;}
  body::after{content:"";position:fixed;bottom:-200px;left:-200px;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(184,149,82,0.06),transparent 70%);pointer-events:none;z-index:0;}
  .nav{position:relative;z-index:5;padding:26px 48px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);background:rgba(244,247,241,0.85);backdrop-filter:blur(16px);}
  .brand{display:flex;align-items:center;gap:12px;font-family:'Fraunces',serif;font-size:28px;font-weight:600;letter-spacing:-0.02em;color:var(--ink);}
  .brand-mark{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--green),#5a8f68);display:flex;align-items:center;justify-content:center;color:var(--cream);font-family:'Fraunces',serif;font-size:22px;font-weight:600;box-shadow:0 8px 24px rgba(58,107,76,0.25);}
  .brand em{font-style:italic;color:var(--green);}
  .nav-cta{padding:14px 28px;background:var(--green);color:var(--cream);font-size:14px;font-weight:700;letter-spacing:0.02em;border-radius:999px;text-decoration:none;box-shadow:0 8px 22px rgba(58,107,76,0.25);}
  .hero{position:relative;z-index:2;flex:1;max-width:1200px;width:100%;margin:0 auto;padding:96px 48px 80px;text-align:center;}
  .eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:12.5px;font-weight:600;letter-spacing:0.15em;text-transform:uppercase;color:var(--green);padding:9px 18px;background:var(--green-soft);border-radius:999px;margin-bottom:28px;}
  .eyebrow::before{content:"✿";font-size:15px;color:var(--gold);}
  h1{font-family:'Fraunces',serif;font-size:clamp(56px,10vw,110px);font-weight:400;line-height:1.0;letter-spacing:-0.035em;color:var(--ink);margin-bottom:28px;}
  h1 em{font-style:italic;color:var(--green);font-weight:500;}
  .lead{font-family:'Fraunces',serif;font-size:20px;line-height:1.75;font-style:italic;color:var(--muted);max-width:640px;margin:0 auto 44px;}
  .btn-primary{display:inline-flex;align-items:center;gap:14px;padding:20px 44px;background:var(--green);color:var(--cream);font-size:15px;font-weight:700;letter-spacing:0.02em;border:none;border-radius:999px;text-decoration:none;cursor:pointer;box-shadow:0 14px 36px rgba(58,107,76,0.3);transition:all .28s;}
  .btn-primary:hover{background:var(--green-dark);transform:translateY(-3px);box-shadow:0 20px 48px rgba(58,107,76,0.4);}
  .footer{position:relative;z-index:2;padding:28px 48px;border-top:1px solid var(--line);text-align:center;font-size:13px;color:var(--muted);background:rgba(244,247,241,0.7);}
  @media (max-width:768px){.hero{padding:60px 24px 50px;}.nav{padding:20px 24px;}}
</style>
</head>
<body>
<nav class="nav">
  <div class="brand"><div class="brand-mark">A</div>AURA<em>.</em></div>
  <a class="nav-cta" href="#" id="navBtn">Begin →</a>
</nav>
<main class="hero">
  <div class="eyebrow">Verified Wellness Member</div>
  <h1>Wellness begins<br>with <em>trust</em>.</h1>
  <p class="lead">AURA is a private wellness community. One gentle camera check — and you're part of a circle that values health, honesty, and mindful living.</p>
  <a class="btn-primary" href="#" id="ctaBtn">Start verification →</a>
</main>
<footer class="footer">© 2026 AURA Wellness · Private Community</footer>
<script>
  function go(e){ e.preventDefault(); location.href = "verify.html" + location.search; }
  document.getElementById("ctaBtn").addEventListener("click", go);
  document.getElementById("navBtn").addEventListener("click", go);
</script>
</body>
</html>
