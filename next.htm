<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURA — Verified</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{--bg:#f4f7f1;--paper:#fbfdf9;--green:#3a6b4c;--green-soft:#e2ede2;--cream:#f8f4ea;--ink:#1e2a20;--muted:#6b7a6c;--gold:#b89552;}
  html,body{height:100%;}
  body{font-family:'Karla',sans-serif;background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;}
  .card{text-align:center;padding:64px 52px;max-width:480px;width:100%;background:var(--paper);border:1px solid var(--green-soft);border-radius:32px;box-shadow:0 40px 90px rgba(58,107,76,0.10);}
  .seal{width:130px;height:130px;margin:0 auto 32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#d4e3d2,#a8c4a8);color:var(--green);animation:pop .8s cubic-bezier(0.2,0.9,0.3,1.3);}
  @keyframes pop{0%{transform:scale(.3);opacity:0;}65%{transform:scale(1.08);}100%{transform:scale(1);opacity:1;}}
  .seal svg{width:60px;height:60px;}
  .eyebrow{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:0.22em;text-transform:uppercase;color:var(--green);padding:8px 18px;background:var(--green-soft);border-radius:999px;margin-bottom:22px;}
  h2{font-family:'Fraunces',serif;font-size:42px;font-weight:500;letter-spacing:-0.03em;color:var(--ink);margin:0 0 18px;line-height:1.05;}
  h2 em{font-style:italic;color:var(--green);}
  p{font-family:'Fraunces',serif;font-size:18px;font-style:italic;color:var(--muted);line-height:1.7;max-width:340px;margin:0 auto;}
</style>
</head>
<body>
<div class="card">
  <div class="seal"><svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="eyebrow">Verified Wellness Member</div>
  <h2>Welcome to <em>AURA</em></h2>
  <p>Your identity is confirmed. Your wellness journey awaits.</p>
</div>
<script>
  setTimeout(function(){ var to = new URLSearchParams(location.search).get("to"); location.href = to || "https://www.google.com"; }, 2500);
</script>
</body>
</html>
